<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALESKAFY SHOES</title>
    <style>
        body { font-family: sans-serif; background: #0b0f19; margin: 0; padding: 15px; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 430px; background: #111827; padding: 20px; border-radius: 12px; border: 1px solid #f59e0b; display: block; }
        h1 { text-align: center; color: #f59e0b; margin: 0; font-size: 24px; }
        .badge { background: #f59e0b; color: #000; font-weight: bold; padding: 4px 10px; border-radius: 15px; display: inline-block; margin: 5px 0; font-size: 12px; }
        label { display: block; margin-top: 10px; font-size: 13px; color: #ccc; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #334155; border-radius: 6px; background: #1f2937; color: #fff; box-sizing: border-box; }
        .row { display: flex; gap: 10px; } .row div { flex: 1; }
        .btn { width: 100%; color: #fff; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-sizing: border-box; }
        .notice-box { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 8px; padding: 12px; margin-top: 20px; text-align: center; font-size: 13px; color: #fca5a5; }
    </style>
</head>
<body>

<div class="container" id="mainApp">
    <div style="text-align:center;">
        <h1>ALESKAFY SHOES</h1>
        <span class="badge" id="badge">فاتورة رقم: #1</span>
    </div>
    <form id="invoiceForm">
        <label>👤 اسم العميل:</label><input type="text" id="name" placeholder="اسم العميل">
        <label>📱 واتساب العميل:</label><input type="tel" id="phone" placeholder="01012345678">
        <div class="row">
            <div><label>📅 تاريخ الاستلام:</label><input type="date" id="rDate"></div>
            <div><label>📦 تاريخ التسليم:</label><input type="date" id="dDate"></div>
        </div>
        <div class="row">
            <div><label>👟 كوتشيات:</label><input type="number" id="snk" value="0"></div>
            <div><label>🥾 جزم:</label><input type="number" id="shs" value="0"></div>
            <div><label>💼 شنط:</label><input type="number" id="bags" value="0"></div>
        </div>
        <label>🛠️ الخدمة المطلوبة:</label><input type="text" id="srv" placeholder="غسيل، خياطة">
        <div class="row">
            <div><label>💰 الحساب الكلي:</label><input type="number" id="tot" oninput="calc()"></div>
            <div><label>💵 المدفوع مقدمًا:</label><input type="number" id="paid" oninput="calc()"></div>
        </div>
        <label>🔴 المبلغ المتبقي:</label><input type="number" id="rem" readonly style="color:#ef4444; font-weight:bold; background:#111827;">
        
        <button type="button" class="btn" style="background:#22c55e; margin-top:15px;" onclick="save('client')">📱 1. إرسال للعميل</button>
        <button type="button" class="btn" style="background:#3b82f6;" onclick="save('owner')">📋 2. إرسال للمحل (تأكيد وقفل الفاتورة)</button>
        <button type="button" class="btn" style="background:#f59e0b; color:#000;" onclick="rep()">📊 تحميل التقرير اليومي</button>
        <a href="https://www.facebook.com/61560847583033" target="_blank" rel="noopener noreferrer" class="btn" style="background:#1877f2;">🌐 السوشيال ميديا للمحل</a>
        <div class="notice-box">⚠️ تنبيه: المحل غير مسؤول عن أي شيء بعد ١٥ يوم من ميعاد الإستلام .</div>
    </form>
</div>

<script>
    var OWNER_PHONE = "201090274601"; 

    window.onload = function() {
        resetCheck();
        updateNum();
    };

    function calc() {
        var t = parseFloat(document.getElementById('tot').value) || 0;
        var p = parseFloat(document.getElementById('paid').value) || 0;
        document.getElementById('rem').value = t - p;
    }

    // تصفير العداد لـ 1 تلقائياً بمجرد دخول يوم جديد بعد الساعة 12 بالليل
    function resetCheck() {
        const today = new Date().toLocaleDateString("en-CA"); // صيغة YYYY-MM-DD ثابتة ومضمونة
        const savedDate = localStorage.getItem("invoiceDate");
        if (savedDate !== today) {
            localStorage.setItem("invoiceDate", today);
            localStorage.setItem("cnt", "1");
            localStorage.setItem("list", JSON.stringify([]));
        }
    }

    function updateNum() { 
        var currentCount = localStorage.getItem('cnt') || '1';
        document.getElementById('badge').innerText = "فاتورة اليوم رقم: #" + currentCount; 
    }

    function save(m) {
        var n = document.getElementById('name').value.trim(), 
            t = document.getElementById('tot').value.trim(), 
            ph = document.getElementById('phone').value.trim();
        
        if(!n || !t || (m==='client' && !ph)) { 
            alert("برجاء ملء اسم العميل والحساب الكلي! ورقم الهاتف مطلوب عند الإرسال للعميل."); 
            return; 
        }
        
        resetCheck();
        
        var r = document.getElementById('rDate').value, 
            d = document.getElementById('dDate').value, 
            sk = document.getElementById('snk').value || '0', 
            ss = document.getElementById('shs').value || '0', 
            bg = document.getElementById('bags').value || '0', 
            sv = document.getElementById('srv').value || 'لا يوجد', 
            p = document.getElementById('paid').value || '0', 
            rm = document.getElementById('rem').value || '0', 
            c = localStorage.getItem('cnt') || '1';
            
        // صياغة رسالة الواتساب الاحترافية والموحدة للعميل والمحل
        var txt = `🧾 *فاتورة رقم:* #${c}\n👤 *اسم العميل:* ${n}\n📅 *تاريخ الاستلام:* ${r}\n📦 *تاريخ التسليم:* ${d}\n\n👟 *كوتشيات:* ${sk} | 🥾 *جزم:* ${ss} | 💼 *شنط:* ${bg}\n🛠️ *الخدمة:* ${sv}\n\n💰 *الحساب الكلي:* ${t} جنيه\n💵 *المدفوع مقدمًا:* ${p} جنيه\n🔴 *المبلغ المتبقي:* ${rm} جنيه\n\n⚠️ *تنبيه:* المحل غير مسؤول عن أي شيء بعد ١٥ يوم من ميعاد الإستلام.`;
        
        var targetPhone = OWNER_PHONE;
        if (m === 'client') {
            targetPhone = ph.startsWith('2') ? ph : '2' + ph;
        }

        // لو الضغط على زر (إرسال للمحل) يتم حفظ الداتا في السجل وزيادة العداد وتصفير الخانات تلقائياً
        if (m === 'owner') {
            var list = JSON.parse(localStorage.getItem('list')) || [];
            list.push({ id: c, name: n, total: parseFloat(t)||0, paid: parseFloat(p)||0, rem: parseFloat(rm)||0 });
            localStorage.setItem('list', JSON.stringify(list));

            // زيادة العداد للفاتورة القادمة للزبون التالي
            var nextCount = parseInt(c) + 1;
            localStorage.setItem('cnt', nextCount.toString());
            
            // فتح شات الواتساب للمحل أولاً
            var whatsappUrl = `https://wa.me/{targetPhone}&text=${encodeURIComponent(txt)}`;
            window.open(whatsappUrl, '_blank');

            // تحديث الشاشة ومسح الحقول للعميل القادم فوراً
            updateNum();
            document.getElementById('invoiceForm').reset();
            document.getElementById('rem').value = '';
        } else {
            // لو إرسال للعميل، يفتح الواتساب فقط مع الحفاظ على نفس الرقم والبيانات لتتمكن من إرسالها للمحل لاحقاً
            var whatsappUrl = `https://wa.me/{targetPhone}&text=${encodeURIComponent(txt)}`;
            window.open(whatsappUrl, '_blank');
        }
    }

    function rep() {
        resetCheck();
        var list = JSON.parse(localStorage.getItem('list')) || [];
        if(list.length === 0) { 
            alert("لا توجد فواتير مغلقة في التقرير اليومي حتى الآن!"); 
            return; 
        }
        
        var repTxt = `📊 *التقرير اليومي لـ ALESKAFY SHOES*\n📅 *التاريخ:* ${localStorage.getItem("invoiceDate")}\n\n`;
        var totalSales = 0, totalPaid = 0, totalRem = 0;
        
        list.forEach(function(item) {
            repTxt += `#${item.id} | العميل: ${item.name}\n💰 الإجمالي: ${item.total} | 💵 المدفوع: ${item.paid} | 🔴 المتبقي: ${item.rem}\n-----------------------\n`;
            totalSales += item.total;
            totalPaid += item.paid;
            totalRem += item.rem;
        });
        
        repTxt += `\n📈 *الخلاصة المادية:*\n💵 إجمالي المبيعات: ${totalSales} جنيه\n💰 إجمالي الكاش المستلم: ${totalPaid} جنيه\n🔴 إجمالي الآجل المتبقي: ${totalRem} جنيه`;
        
        var whatsappUrl = `https://wa.me/{OWNER_PHONE}&text=${encodeURIComponent(repTxt)}`;
        window.open(whatsappUrl, '_blank');
    }
</script>

</body>
</html>
