<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة طلبات المحل</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 15px; }
        .container { max-width: 100%; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); box-sizing: border-box; }
        h2 { text-align: center; color: #333; font-size: 20px; margin-bottom: 5px; }
        h4 { text-align: center; color: #666; margin-top: 0; font-size: 14px; }
        label { font-weight: bold; display: block; margin-top: 12px; font-size: 14px; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .row { display: flex; gap: 10px; }
        .row div { flex: 1; }
        /* تصميم الأزرار المنفصلة */
        .btn-client { width: 100%; background-color: #25D366; color: white; padding: 14px; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-sizing: border-box; }
        .btn-client:hover { background-color: #1ebd57; }
        .btn-owner { width: 100%; background-color: #007bff; color: white; padding: 14px; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-sizing: border-box; }
        .btn-owner:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h2>👟 نظام إدارة طلبات المحل 🥾</h2>
    <h4>تسجيل الطلب وإرساله بأزرار منفصلة</h4>
    
    <form id="orderForm">
        <label>اسم العميل:</label>
        <input type="text" id="clientName" required placeholder="اسم العميل ثلاثي">

        <label>رقم واتساب العميل:</label>
        <input type="tel" id="clientPhone" required placeholder="مثال: 01012345678">

        <div class="row">
            <div>
                <label>تاريخ الاستلام:</label>
                <input type="date" id="receiveDate" required>
            </div>
            <div>
                <label>تاريخ التسليم:</label>
                <input type="date" id="deliveryDate" required>
            </div>
        </div>

        <div class="row">
            <div>
                <label>عدد الكوتشيات:</label>
                <input type="number" id="sneakersCount" value="0" min="0">
            </div>
            <div>
                <label>عدد الجزم الكلاسيك:</label>
                <input type="number" id="shoesCount" value="0" min="0">
            </div>
        </div>

        <label>العمل المطلوب (ما الذي سيتم عمله؟):</label>
        <input type="text" id="serviceType" required placeholder="مثال: غسيل وتجديد نعل، خياطة">

        <div class="row">
            <div>
                <label>الحساب الإجمالي (جنيه):</label>
                <input type="number" id="totalAmount" required oninput="calculateRemaining()">
            </div>
            <div>
                <label>المدفوع مقدمًا (جنيه):</label>
                <input type="number" id="paidAmount" required oninput="calculateRemaining()">
            </div>
        </div>

        <label>المبلغ المتبقي (جنيه):</label>
        <input type="number" id="remainingAmount" readonly style="background-color: #e9ecef;">

        <!-- الزر الأول للعميل -->
        <button type="button" class="btn-client" onclick="sendToClient()">📱 1. إرسال الفاتورة للعميل</button>
        
        <!-- الزر الثاني لك أنت صاحب المحل -->
        <button type="button" class="btn-owner" onclick="sendToOwner()">📋 2. إرسال نسخة وتأكيد للمحل</button>
    </form>
</div>

<script>
    function calculateRemaining() {
        const total = parseFloat(document.getElementById('totalAmount').value) || 0;
        const paid = parseFloat(document.getElementById('paidAmount').value) || 0;
        document.getElementById('remainingAmount').value = total - paid;
    }

    // دالة لتجهيز نص الفاتورة الموحد لمنع التكرار
    function generateMessage() {
        const name = document.getElementById('clientName').value;
        const receiveDate = document.getElementById('receiveDate').value;
        const deliveryDate = document.getElementById('deliveryDate').value;
        const sneakers = document.getElementById('sneakersCount').value;
        const shoes = document.getElementById('shoesCount').value;
        const service = document.getElementById('serviceType').value;
        const total = document.getElementById('totalAmount').value;
        const paid = document.getElementById('paidAmount').value;
        const remaining = document.getElementById('remainingAmount').value;

        // توليد رابط التتبع المخصص لصفحة track.html
        const trackPageUrl = `https://github.io{encodeURIComponent(name)}&rec=${receiveDate}&del=${deliveryDate}&snk=${sneakers}&shs=${shoes}&srv=${encodeURIComponent(service)}&tot=${total}&paid=${paid}&rem=${remaining}`;

        return `✨ *طلب صيانة أحذية جديد* ✨\n\n` +
               `👤 *اسم العميل:* ${name}\n` +
               `📅 *تاريخ الاستلام:* ${receiveDate}\n` +
               `📦 *تاريخ التسليم المتوقع:* ${deliveryDate}\n\n` +
               `👟 *عدد الكوتشيات:* ${sneakers}\n` +
               `🥾 *عدد الجزم الكلاسيك:* ${shoes}\n` +
               `🛠️ *الخدمة المطلوبة:* ${service}\n\n` +
               `💰 *الحساب الإجمالي:* ${total} جنيه\n` +
               `💵 *المدفوع مقدمًا:* ${paid} جنيه\n` +
               `🔴 *المبلغ المتبقي:* ${remaining} جنيه\n\n` +
               `🔗 *رابط تتبع الفاتورة والتحويل:* \n${trackPageUrl}`;
    }

    // 1. إرسال للعميل
    function sendToClient() {
        let phone = document.getElementById('clientPhone').value.trim();
        if(!phone || !document.getElementById('clientName').value) {
            alert("⚠️ برجاء ملء البيانات الأساسية ورقم العميل أولاً!");
            return;
        }
        if (phone.startsWith("0")) phone = "2" + phone;

        const encodedMessage = encodeURIComponent(generateMessage());
        window.location.href = "whatsapp://send?phone=" + phone + "&text=" + encodedMessage;
    }

    // 2. إرسال لك أنت كصاحب محل
    function sendToOwner() {
        if(!document.getElementById('clientName').value || !document.getElementById('totalAmount').value) {
            alert("⚠️ برجاء ملء البيانات الأساسية أولاً!");
            return;
        }
        const myPhone = "201014828660"; // رقم محلك الثابت
        
        // إضافة كلمة (نسخة المحل للتأكيد) في بداية الرسالة الموجهة لك
        const ownerMessage = `📥 *[نسخة المحل للتأكيد والأرشفة]*\n\n` + generateMessage();
        
        const encodedMessage = encodeURIComponent(ownerMessage);
        window.location.href = "whatsapp://send?phone=" + myPhone + "&text=" + encodedMessage;
    }
</script>
</body>
</html>
