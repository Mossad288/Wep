<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALESKAFY SHOES</title>
    <style>
        body { font-family: sans-serif; background: #0b0f19; margin: 0; padding: 15px; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 430px; background: #111827; padding: 20px; border-radius: 12px; border: 1px solid #f59e0b; }
        h1 { text-align: center; color: #f59e0b; margin: 0; font-size: 24px; }
        .badge { background: #f59e0b; color: #000; font-weight: bold; padding: 4px 10px; border-radius: 15px; display: inline-block; margin: 5px 0; font-size: 12px; }
        label { display: block; margin-top: 10px; font-size: 13px; color: #ccc; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #334155; border-radius: 6px; background: #1f2937; color: #fff; box-sizing: border-box; }
        .row { display: flex; gap: 10px; } .row div { flex: 1; }
        .btn { width: 100%; color: #fff; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-sizing: border-box; }
        .notice-box { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 8px; padding: 12px; margin-top: 20px; text-align: center; font-size: 13px; color: #fca5a5; }
        .thanks-box { text-align: center; font-size: 14px; font-weight: bold; color: #f59e0b; margin-top: 12px; }
    </style>
</head>
<body>

<div class="container" id="mainApp" style="display: block;">
    <div style="text-align:center;">
        <h1>ALESKAFY SHOES</h1>
        <span class="badge" id="badge">فاتورة رقم: #1</span>
    </div>
    <form>
        <label>👤 اسم العميل:</label><input type="text" id="name" placeholder="اسم العميل">
        <label>📱 واتساب العميل:</label><input type="tel" id="phone" placeholder="01012345678">
        <div class="row">
            <div><label>📅 تاريخ الاستلام:</label><input type="date" id="rDate"></div>
            <div><label>📦 تاريخ التسليم:</label><input type="date" id="dDate"></div>
        </div>
        <div class="row">
            <div><label>👟 كوتشيات:</label><input type="number" id="snk" value="0"></div>
            <div><label>🥾 جزم:</label><input type="number" id="shs" value="0"></div>
            <div><label>💼 شنط:</label><input type="number" id="bags" value="0"></div>
        </div>
        <label>🛠️ الخدمة المطلوبة:</label><input type="text" id="srv" placeholder="غسيل، خياطة">
        <div class="row">
            <div><label>💰 الحساب الكلي:</label><input type="number" id="tot" oninput="calc()"></div>
            <div><label>💵 المدفوع مقدمًا:</label><input type="number" id="paid" oninput="calc()"></div>
        </div>
        <label>🔴 المبلغ المتبقي:</label><input type="number" id="rem" readonly style="color:#ef4444; font-weight:bold; background:#111827;">
        
        <button type="button" class="btn" style="background:#22c55e; margin-top:15px;" onclick="save('client')">📱 1. إرسال للعميل</button>
        <button type="button" class="btn" style="background:#3b82f6;" onclick="save('owner')">📋 2. إرسال للمحل</button>
        <button type="button" class="btn" style="background:#f59e0b; color:#000;" onclick="rep()">📊 تحميل التقرير اليومي</button>
        <a href="https://facebook.com"
   target="_blank"
   rel="noopener noreferrer"
   class="btn"
   style="background:#1877f2;">
   🌐 السوشيال ميديا للمحل

</a>
        <div class="notice-box">⚠️ تنبيه: المحل غير مسؤول عن أي شيء بعد ١٥ يوم من ميعاد الإستلام  .</div>
        
    </form>
</div>

<script>
    var OWNER_PHONE = "201090274601"; var lastSavedName = "";

    // تشغيل فوري للنظام لتخطي خطوة تسجيل الدخول المحذوفة
    window.onload = function() {
        resetCheck();
        updateNum();
    }

    function calc() {
        var t = parseFloat(document.getElementById('tot').value) || 0;
        var p = parseFloat(document.getElementById('paid').value) || 0;
        document.getElementById('rem').value = t - p;
    }
    function resetCheck() {
    const today = new Date().toLocaleDateString("en-CA");
    const savedDate = localStorage.getItem("invoiceDate");

    if (savedDate !== today) {
        localStorage.setItem("invoiceDate", today);
        localStorage.setItem("cnt", "1");
        localStorage.setItem("list", JSON.stringify([]));
    }
}
    function updateNum() { document.getElementById('badge').innerText = "فاتورة اليوم رقم: #" + (localStorage.getItem('cnt') || '1'); }
    function save(m) {
        var n = document.getElementById('name').value, t = document.getElementById('tot').value, ph = document.getElementById('phone').value.trim();
        if(!n || !t || (m==='client' && !ph)) { alert("املا البيانات!"); return; }
        resetCheck();
        var r = document.getElementById('rDate').value, d = document.getElementById('dDate').value, sk = document.getElementById('snk').value, ss = document.getElementById('shs').value, bg = document.getElementById('bags').value, sv = document.getElementById('srv').value, p = document.getElementById('paid').value, rm = document.getElementById('rem').value, c = localStorage.getItem('cnt') || '1';
        var list = JSON.parse(localStorage.getItem('list')) || [];
        if (n !== lastSavedName) {
            list.push({ id: c, name: n, total: parseFloat(t)||0, paid: parseFloat(p)||0, rem: parseFloat(rm)||0 });
            localStorage.setItem('list', JSON.stringify(list)); lastSavedName = n;
        } else { c = (parseInt(c) - 1).toString(); if(c === "0") c = "1"; }
        
        var txt = `👤 *اسم العميل:* ${n}\n📅 *تاريخ الاستلام:* ${r}\n📦 *تاريخ التسليم:* ${d}\n\n👟 *كوتشيات:* ${sk} | 🥾 *جزم:* ${ss} | 💼 *شنط:* ${bg}\n🛠️ *الخدمة:* ${sv}\n\n💰 *الحساب الكلي:* ${t} جنيه\n💵 *المدفوع مقدمًا:* ${p} جنيه\n🔴 *المبلغ المتبقي:* ${rm} جنيه\n\n⚠️ *`
</script>

</body>
</html>
