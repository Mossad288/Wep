<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة طلبات محل الأحذية - نسخة الهاتف</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 15px; }
        .container { max-width: 100%; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; font-size: 20px; }
        label { font-weight: bold; display: block; margin-top: 12px; font-size: 14px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .row { display: flex; gap: 10px; }
        .row div { flex: 1; }
        button { width: 100%; background-color: #28a745; color: white; padding: 12px; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .vodafone-btn { background-color: #e60000; text-align: center; display: block; padding: 12px; color: white; text-decoration: none; border-radius: 5px; margin-top: 15px; font-weight: bold; font-size: 14px; }
        .orders-list { margin-top: 25px; padding: 10px; background: #eee; border-radius: 5px; }
        .order-card { background: white; padding: 10px; margin-bottom: 10px; border-right: 5px solid #28a745; border-radius: 3px; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h2>👟 نظام إدارة طلبات المحل 🥾</h2>
    
    <form id="orderForm">
        <label>اسم العميل:</label>
        <input type="text" id="clientName" required placeholder="اسم العميل">

        <div class="row">
            <div>
                <label>تاريخ الاستلام:</label>
                <input type="date" id="receiveDate" required>
            </div>
            <div>
                <label>تاريخ التسليم:</label>
                <input type="date" id="deliveryDate" required>
            </div>
        </div>

        <div class="row">
            <div>
                <label>عدد الكوتشيات:</label>
                <input type="number" id="sneakersCount" value="0" min="0">
            </div>
            <div>
                <label>عدد الجزم:</label>
                <input type="number" id="shoesCount" value="0" min="0">
            </div>
        </div>

        <label>العمل المطلوب (التصليح/التنظيف):</label>
        <input type="text" id="serviceType" required placeholder="مثال: غسيل وتجديد نعل">

        <div class="row">
            <div>
                <label>الحساب كام:</label>
                <input type="number" id="totalAmount" required oninput="calculateRemaining()">
            </div>
            <div>
                <label>المدفوع مقدمًا:</label>
                <input type="number" id="paidAmount" required oninput="calculateRemaining()">
            </div>
        </div>

        <label>المبلغ المتبقي:</label>
        <input type="number" id="remainingAmount" readonly style="background-color: #e9ecef;">

        <button type="button" onclick="saveOrder()">حفظ الطلب بالذاكرة</button>
    </form>

    <!-- لينك فودافون كاش سحري يفتح الواتساب مباشرة للدفع -->
    <a href="https://wa.me" target="_blank" class="vodafone-btn">💳 الدفع عبر فودافون كاش</a>

    <div class="orders-list">
        <h3>📋 الطلبات المسجلة حالياً:</h3>
        <div id="ordersContainer">لا توجد طلبات مسجلة بعد.</div>
    </div>
</div>

<script>
    function calculateRemaining() {
        const total = parseFloat(document.getElementById('totalAmount').value) || 0;
        const paid = parseFloat(document.getElementById('paidAmount').value) || 0;
        document.getElementById('remainingAmount').value = total - paid;
    }

    // محاكاة للباك آند: حفظ البيانات في الـ LocalStorage الخاص بالهاتف
    function saveOrder() {
        const name = document.getElementById('clientName').value;
        const service = document.getElementById('serviceType').value;
        if(!name || !service) return alert("املا البيانات أولاً");

        const order = {
            id: Math.floor(1000 + Math.random() * 9000),
            clientName: name,
            receiveDate: document.getElementById('receiveDate').value,
            deliveryDate: document.getElementById('deliveryDate').value,
            sneakersCount: document.getElementById('sneakersCount').value,
            shoesCount: document.getElementById('shoesCount').value,
            serviceType: service,
            totalAmount: document.getElementById('totalAmount').value,
            paidAmount: document.getElementById('paidAmount').value,
            remainingAmount: document.getElementById('remainingAmount').value
        };

        let orders = JSON.parse(localStorage.getItem('shoe_orders')) || [];
        orders.push(order);
        localStorage.setItem('shoe_orders', JSON.stringify(orders));
        
        alert("✅ تم حفظ الطلب في ذاكرة الموقع بنجاح!");
        displayOrders();
        document.getElementById('orderForm').reset();
    }

    function displayOrders() {
        let orders = JSON.parse(localStorage.getItem('shoe_orders')) || [];
        const container = document.getElementById('ordersContainer');
        if(orders.length === 0) {
            container.innerHTML = "لا توجد طلبات.";
            return;
        }
        container.innerHTML = "";
        orders.forEach(o => {
            container.innerHTML += `
                <div class="order-card">
                    <b>رقم الطلب:</b> #${o.id} | <b>العميل:</b> ${o.clientName}<br>
                    <b>الأشياء:</b> كوتشي (${o.sneakersCount}) - جزمة (${o.shoesCount})<br>
                    <b>المطلوب:</b> ${o.serviceType}<br>
                    <b>التوصيل:</b> من ${o.receiveDate} إلى ${o.deliveryDate}<br>
                    <b>الحساب:</b> كلي: ${o.totalAmount} | مدفوع: ${o.paidAmount} | <span style="color:red">متبقي: ${o.remainingAmount}</span>
                </div>
            `;
        });
    }
    // عرض الطلبات عند فتح الصفحة
    displayOrders();
</script>
</body>
</html>
