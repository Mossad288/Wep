<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALESKAFY SHOES</title>
    <style>
        body { font-family: sans-serif; background: #070a13; margin: 0; padding: 15px; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 430px; background: rgba(15,23,42,0.6); padding: 20px; border-radius: 12px; border: 1px solid #f59e0b; backdrop-filter: blur(10px); }
        h1 { text-align: center; color: #f59e0b; margin: 0; font-size: 24px; }
        .badge { background: #f59e0b; color: #000; font-weight: bold; padding: 4px 10px; border-radius: 15px; display: inline-block; margin: 5px 0; font-size: 12px; }
        label { display: block; margin-top: 10px; font-size: 13px; color: #ccc; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #334155; border-radius: 6px; background: rgba(30,41,59,0.7); color: #fff; box-sizing: border-box; }
        .row { display: flex; gap: 10px; } .row div { flex: 1; }
        .btn { width: 100%; color: #fff; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div style="text-align:center;">
        <h1>ALESKAFY SHOES</h1>
        <span class="badge" id="badge">فاتورة رقم: #1</span>
    </div>
    <form>
        <label>👤 اسم العميل:</label><input type="text" id="name" placeholder="اسم العميل">
        <label>📱 واتساب العميل:</label><input type="tel" id="phone" placeholder="01012345678">
        <div class="row">
            <div><label>📅 تاريخ الاستلام:</label><input type="date" id="rDate"></div>
            <div><label>📦 تاريخ التسليم:</label><input type="date" id="dDate"></div>
        </div>
        <div class="row">
            <div><label>👟 كوتشيات:</label><input type="number" id="snk" value="0"></div>
            <div><label>🥾 جزم:</label><input type="number" id="shs" value="0"></div>
        </div>
        <label>🛠️ الخدمة المطلوبة:</label><input type="text" id="srv" placeholder="غسيل، خياطة">
        <div class="row">
            <div><label>💰 الحساب الكلي:</label><input type="number" id="tot" oninput="calc()"></div>
            <div><label>💵 المدفوع مقدمًا:</label><input type="number" id="paid" oninput="calc()"></div>
        </div>
        <label>🔴 المبلغ المتبقي:</label><input type="number" id="rem" readonly style="color:#ef4444; font-weight:bold;">
        
        <button type="button" class="btn" style="background:#22c55e; margin-top:15px;" onclick="save('client')">📱 1. إرسال للعميل</button>
        <button type="button" class="btn" style="background:#3b82f6;" onclick="save('owner')">📋 2. إرسال للمحل</button>
        <button type="button" class="btn" style="background:#f59e0b; color:#000;" onclick="rep()">📊 تحميل التقرير اليومي</button>
    </form>
</div>
<script>
    resetCheck(); updateNum();
    function calc() {
        var t = parseFloat(document.getElementById('tot').value) || 0;
        var p = parseFloat(document.getElementById('paid').value) || 0;
        document.getElementById('rem').value = t - p;
    }
    function resetCheck() {
        var s = localStorage.getItem('day_s'); var n = new Date().getTime();
        if (!s || (n - parseInt(s) >= 86400000)) {
            localStorage.setItem('day_s', n); localStorage.setItem('cnt', '1'); localStorage.setItem('list', JSON.stringify([]));
        }
    }
    function updateNum() {
        document.getElementById('badge').innerText = "فاتورة اليوم رقم: #" + (localStorage.getItem('cnt') || '1');
    }
    function save(m) {
        var n = document.getElementById('name').value; var t = document.getElementById('tot').value; var ph = document.getElementById('phone').value.trim();
        if(!n || !t || (m==='client' && !ph)) { alert("املا البيانات الأساسية!"); return; }
        resetCheck();
        var r = document.getElementById('rDate').value, d = document.getElementById('dDate').value, sk = document.getElementById('snk').value, ss = document.getElementById('shs').value, sv = document.getElementById('srv').value, p = document.getElementById('paid').value, rm = document.getElementById('rem').value, c = localStorage.getItem('cnt') || '1';
        var obj = { id: c, name: n, total: parseFloat(t)||0, paid: parseFloat(p)||0, rem: parseFloat(rm)||0 };
        var list = JSON.parse(localStorage.getItem('list')) || [];
        if (!list.some(function(x){return x.id===c && x.name===n;})) {
            list.push(obj); localStorage.setItem('list', JSON.stringify(list));
            localStorage.setItem('cnt', (parseInt(c)+1).toString()); updateNum();
        }
        if (m === 'client') {
            if (ph.startsWith("0")) ph = "2" + ph;
            var url = "https://github.io"+encodeURIComponent(n)+"&rec="+r+"&del="+d+"&snk="+sk+"&shs="+ss+"&srv="+encodeURIComponent(sv)+"&tot="+t+"&paid="+p+"&rem="+rm;
            var msg = "✨ *ALESKAFY SHOES* ✨\n🧾 *فاتورة رقم:* #"+c+"\n👤 *العميل:* "+n+"\n💰 *الإجمالي:* "+t+" ج\n💵 *المدفوع:* "+p+" ج\n🔴 *المتبقي:* "+rm+" ج\n🔗 *رابط التتبع:* \n"+url;
            window.location.href = "whatsapp://send?phone="+ph+"&text="+encodeURIComponent(msg);
        } else {
            var oMsg = "📥 *[نسخة المحل رقم #"+c+"]*\n👤 *العميل:* "+n+"\n🛠️ *الخدمة:* "+sv+"\n💰 *الإجمالي:* "+t+" ج | *المدفوع:* "+p+" ج\n🔴 *المتبقي:* "+rm+" ج";
            window.location.href = "whatsapp://send?phone=201014828660&text="+encodeURIComponent(oMsg);
        }
    }
    function rep() {
        var list = JSON.parse(localStorage.getItem('list')) || [];
        if (list.length === 0) { alert("لا توجد فواتير اليوم!"); return; }
        var t = 0, p = 0, r = 0, txt = "📊 تقرير حسابات الإسكافي شوز 📊\n====================\n\n";
        list.forEach(function(x) {
            txt += "فاتورة #"+x.id+" - العميل: "+x.name+"\nالحساب: "+x.total+" ج | المدفوع: "+x.paid+" ج | المتبقي: "+x.rem+" ج\n--------------------\n";
            t+=x.total; p+=x.paid; r+=x.rem;
        });
        txt += "\n====================\n💰 إجمالي اليوم: "+t+" ج\n💵 إجمالي الخزنة: "+p+" ج\n🔴 إجمالي المتبقي بالسوق: "+r+" ج";
        var b = new Blob([txt], { type: 'text/plain;charset=utf-8' }); var lnk = document.createElement('a');
        lnk.href = URL.createObjectURL(b); lnk.download = "Report_" + new Date().toISOString().slice(0,10) + ".txt";
        document.body.appendChild(lnk); lnk.click(); document.body.removeChild(lnk);
    }
</script>
</body>
</html>
