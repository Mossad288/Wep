<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALESKAFY SHOES</title>
    <style>
        body { font-family: sans-serif; background: #0b0f19; margin: 0; padding: 15px; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box; }
        .lock-container { width: 100%; max-width: 380px; background: #111827; padding: 30px 20px; border-radius: 12px; border: 1px solid #f59e0b; text-align: center; }
        .container { width: 100%; max-width: 430px; background: #111827; padding: 20px; border-radius: 12px; border: 1px solid #f59e0b; display: none; }
        h1 { text-align: center; color: #f59e0b; margin: 0; font-size: 24px; }
        .badge { background: #f59e0b; color: #000; font-weight: bold; padding: 4px 10px; border-radius: 15px; display: inline-block; margin: 5px 0; font-size: 12px; }
        label { display: block; margin-top: 10px; font-size: 13px; color: #ccc; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #334155; border-radius: 6px; background: #1f2937; color: #fff; box-sizing: border-box; }
        .row { display: flex; gap: 10px; } .row div { flex: 1; }
        .btn { width: 100%; color: #fff; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-sizing: border-box; text-align: center; }
        .notice-box { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 8px; padding: 12px; margin-top: 20px; text-align: center; font-size: 13px; color: #fca5a5; }
    </style>
</head>
<body>

<div id="lockScreen" class="lock-container">
    <h1 style="color:#f59e0b; margin:0;">ALESKAFY SHOES</h1>
    <p style="color:#94a3b8; font-size:12px; margin-bottom:20px;">Secure Management System</p>
    <input type="password" id="passInput" placeholder="أدخل كود الدخول السري" style="text-align:center; font-size:18px; margin-bottom:15px;">
    <button type="button" class="btn" style="background:#f59e0b; color:#000; font-weight:800;" onclick="checkPassword()">🔓 تسجيل الدخول</button>
</div>

<div class="container" id="mainApp">
    <div style="text-align:center;">
        <h1>ALESKAFY SHOES</h1>
        <span class="badge" id="badge">فاتورة رقم: #1</span>
    </div>
    <form id="invoiceForm">
        <label>👤 اسم العميل:</label><input type="text" id="name" placeholder="اسم العميل">
        <label>📱 واتساب العميل:</label><input type="tel" id="phone" placeholder="01012345678">
        <div class="row">
            <div><label>📅 تاريخ الاستلام:</label><input type="date" id="rDate"></div>
            <div><label>📦 تاريخ التسليم:</label><input type="date" id="dDate"></div>
        </div>
        <div class="row">
            <div><label>👟 كوتشيات:</label><input type="number" id="snk" value="0"></div>
            <div><label>🥾 جزم:</label><input type="number" id="shs" value="0"></div>
            <div><label>💼 شنط:</label><input type="number" id="bags" value="0"></div>
        </div>
        <label>🛠️ الخدمة المطلوبة:</label><input type="text" id="srv" placeholder="غسيل، خياطة">
        <div class="row">
            <div><label>💰 الحساب الكلي:</label><input type="number" id="tot" oninput="calc()"></div>
            <div><label>💵 المدفوع مقدمًا:</label><input type="number" id="paid" oninput="calc()"></div>
        </div>
        <label>🔴 المبلغ المتبقي:</label><input type="number" id="rem" readonly style="color:#ef4444; font-weight:bold; background:#111827;">
        
        <!-- تعديل الأزرار إلى روابط مباشرة لتجنب حظر المتصفح -->
        <a id="btnClient" href="#" class="btn" style="background:#22c55e; margin-top:15px;" onclick="return processSend('client')">📱 1. إرسال للعميل</a>
        <a id="btnOwner" href="#" class="btn" style="background:#3b82f6;" onclick="return processSend('owner')">📋 2. إرسال للمحل</a>
        <button type="button" class="btn" style="background:#f59e0b; color:#000;" onclick="rep()">📊 تحميل التقرير اليومي</button>
        <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" class="btn" style="background:#1877f2;">🌐 السوشيال ميديا للمحل</a>
        
        <div class="notice-box">⚠️ تنبيه: المحل غير مسؤول عن أي شيء بعد ١٥ يوم من ميعاد الإستلام .</div>
    </form>
</div>

<script>
    var OWNER_PHONE = "201090274601"; 
    var lastSavedName = "";

    function checkPassword() {
        if (document.getElementById('passInput').value === '2020') {
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            resetCheck();
            updateNum();
        } else {
            alert("❌ رمز خاطئ!");
        }
    }

    function calc() {
        var t = parseFloat(document.getElementById('tot').value) || 0;
        var p = parseFloat(document.getElementById('paid').value) || 0;
        document.getElementById('rem').value = t - p;
    }

    function resetCheck() {
        const today = new Date().toLocaleDateString("en-CA");
        const savedDate = localStorage.getItem("invoiceDate");
        if (savedDate !== today) {
            localStorage.setItem("invoiceDate", today);
            localStorage.setItem("cnt", "1");
            localStorage.setItem("list", JSON.stringify([]));
        }
    }

    function updateNum() { 
        document.getElementById('badge').innerText = "فاتورة اليوم رقم: #" + (localStorage.getItem('cnt') || '1'); 
    }

    function processSend(target) {
        var n = document.getElementById('name').value.trim();
        var t = document.getElementById('tot').value.trim();
        var ph = document.getElementById('phone').value.trim();
        
        if(!n || !t || (target === 'client' && !ph)) { 
            alert("برجاء ملء البيانات الأساسية (الاسم، الحساب الكلي، ورقم العميل للـتأكيد)!"); 
            return false; 
        }
        
        resetCheck();
        
        var r = document.getElementById('rDate').value, 
            d = document.getElementById('dDate').value, 
            sk = document.getElementById('snk').value, 
            ss = document.getElementById('shs').value, 
            bg = document.getElementById('bags').value, 
            sv = document.getElementById('srv').value, 
            p = document.getElementById('paid').value || '0', 
            rm = document.getElementById('rem').value || '0', 
            c = localStorage.getItem('cnt') || '1';
            
        var list = JSON.parse(localStorage.getItem('list')) || [];
        
        if (n !== lastSavedName) {
            list.push({ id: c, name: n, total: parseFloat(t)||0, paid: parseFloat(p)||0, rem: parseFloat(rm)||0 });
            localStorage.setItem('list', JSON.stringify(list)); 
            lastSavedName = n;
            c = (parseInt(c) + 1).toString();
            localStorage.setItem('cnt', c);
            updateNum();
        }

        var txt = `👤 *اسم العميل:* ${n}\n📅 *تاريخ الاستلام:* ${r}\n📦 *تاريخ التسليم:* ${d}\n\n👟 *كوتشيات:* ${sk} | 🥾 *جزم:* ${ss} | 💼 *شنط:* ${bg}\n🛠️ *الخدمة:* ${sv}\n\n💰 *الحساب الكلي:* ${t} جنيه\n💵 *المدفوع مقدمًا:* ${p} جنيه\n🔴 *المبلغ المتبقي:* ${rm} جنيه\n\n⚠️ *تنبيه:* المحل غير مسؤول عن أي شيء بعد ١٥ يوم من ميعاد الإستلام.`;
        
        var targetPhone = OWNER_PHONE;
        if (target === 'client') {
            // تنظيف الرقم والتأكد من وجود الكود الدولي لمصر
            var cleanPhone = ph.replace(/\D/g, ''); 
            if (cleanPhone.startsWith('01')) {
                targetPhone = '2' + cleanPhone;
            } else if (cleanPhone.startsWith('1')) {
                targetPhone = '20' + cleanPhone;
            } else {
                targetPhone = cleanPhone;
            }
        }
        
        // تحديث الرابط بشكل مباشر والذهاب إليه لتجنب حظر المتصفحات للـ Pop-ups
        var whatsappUrl = `https://whatsapp.com{targetPhone}&text=${encodeURIComponent(txt)}`;
        
        if (target === 'client') {
            document.getElementById('btnClient').href = whatsappUrl;
            document.getElementById('btnClient').target = "_blank";
        } else {
            document.getElementById('btnOwner').href = whatsappUrl;
            document.getElementById('btnOwner').target = "_blank";
        }
        
        return true;
    }

    function rep() {
        var list = JSON.parse(localStorage.getItem('list')) || [];
        if(list.length === 0) { alert("لا توجد فواتير مسجلة لليوم!"); return; }
        
        var reportTxt = `📊 *التقرير اليومي لـ ALESKAFY SHOES*\n📅 *التاريخ:* ${localStorage.getItem("invoiceDate")}\n\n`;
        var totalSales = 0, totalPaid = 0, totalRem = 0;
        
        list.forEach(function(item) {
            reportTxt += `#${item.id} | العميل: ${item.name}\n💰 كلي: ${item.total} | 💵 مقدم: ${item.paid} | 🔴 متبقي: ${item.rem}\n----------------------\n`;
            totalSales += item.total;
            totalPaid += item.paid;
            totalRem += item.rem;
        });
        
        reportTxt += `\n📈 *الإجماليات:*\n💰 إجمالي المبيعات: ${totalSales} جنيه\n💵 إجمالي المقدم: ${totalPaid} جنيه\n🔴 إجمالي المتبقي: ${totalRem} جنيه`;
        
        var blob = new Blob([reportTxt], { type: "text/plain;charset=utf-8" });
        var link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `تقرير_${localStorage.getItem("invoiceDate")}.txt`;
        link.click();
    }
</script>

</body>
</html>
